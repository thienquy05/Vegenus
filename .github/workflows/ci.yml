# CI (design 6). One required check: `gate`. No secrets, no write permissions.
name: ci

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_BROWSERS_PATH: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.f.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: f
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE" ]; then echo app=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --no-renames --name-only "origin/$BASE...HEAD")
          # here-string, not a pipe: under pipefail, grep -q exiting early
          # makes printf fail with SIGPIPE and the else branch would say false
          if grep -qvE '^(docs/.+|[^/]+\.md)$' <<< "$files"
          then echo app=true; else echo app=false; fi >> "$GITHUB_OUTPUT"

  privacy-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # ponytail: placeholder until T1.6 adds scripts/privacy-scan.sh and the commit check (design 6 §8).
      - run: echo "privacy-scan placeholder (T1.6)"

  lint-types:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:gate

  unit:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run --coverage

  db:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      - run: supabase start -x studio,imgproxy,mailpit,logflare,vector,edge-runtime,supavisor,realtime
      - run: supabase test db

  e2e:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - run: npx playwright install --with-deps "$BROWSER"
      # ponytail: no Supabase here until the app reads from it (design 6 §4 keeps storage, auth, gateway)
      - run: npm run build
      - run: npx playwright test --project="$BROWSER"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  a11y-perf:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/playwright-core/.local-browsers
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --project=a11y
      - name: Lighthouse budgets (design 5 §6.1)
        run: |
          export CHROME_PATH=$(node -p "require('playwright-core').chromium.executablePath()")
          npx lhci autorun
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-perf-reports
          path: |
            test-results/
            .lighthouseci/
          include-hidden-files: true
          retention-days: 7

  gate:
    if: always()
    needs: [changes, privacy-scan, lint-types, unit, db, e2e, a11y-perf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/gate.jq
          sparse-checkout-cone-mode: false
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: printf '%s' "$NEEDS" | jq -e -f scripts/gate.jq
